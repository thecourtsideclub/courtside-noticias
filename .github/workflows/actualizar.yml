name: Actualizar titulares

# Se ejecuta a las 8:00 y a las 20:00 (hora de Madrid), también en horario de verano.
# GitHub usa la hora UTC, así que se lanza a dos horas posibles y solo continúa la que coincide.
on:
  schedule:
    - cron: "0 6,7,18,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: titulares

jobs:
  titulares:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la hora en Madrid
        id: hora
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          echo "Hora en Madrid: $H"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "08" ] || [ "$H" = "20" ]; then
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar titulares
        if: steps.hora.outputs.go == '1'
        run: |
          python3 - <<'PY'
          import json, re, html, urllib.request, datetime, email.utils, xml.etree.ElementTree as ET

          FEEDS = [
              {"url": "https://www.eurohoops.net/es/feed/", "s": "Eurohoops", "l": "es"},
              {"url": "https://www.gigantes.com/feed/", "s": "Gigantes del Basket", "l": "es"},
              {"url": "https://www.espn.com/espn/rss/nba/news", "s": "ESPN", "l": "en", "c": "nba"},
              {"url": "https://www.eurohoops.net/en/euroleague/feed/", "s": "Eurohoops", "l": "en", "c": "euroleague"},
              {"url": "https://www.eurohoops.net/en/feed/", "s": "Eurohoops", "l": "en"},
          ]
          RULES = [
              ("nba", r"\bNBA\b|Lakers|Celtics|Warriors|Knicks|Bulls|Heat|Spurs|Mavericks|Mavs|Nuggets|Thunder|Bucks|Suns|Clippers|Rockets|Grizzlies|Pelicans|Timberwolves|Wolves|Kings|Jazz|Blazers|Trail Blazers|Hawks|Hornets|Pistons|Pacers|Cavaliers|Cavs|Raptors|Nets|76ers|Sixers|Magic|Wizards|G League|Wembanyama"),
              ("euroleague", r"EuroLeague|Euroliga|Euroleague|EuroCup|Eurocup|Final Four|Olympiacos|Olympiakos|Panathinaikos|Fenerbah|Efes|Partizan|Crvena|Red Star|Estrella Roja|Maccabi|Hapoel|Zalgiris|Žalgiris|Baskonia|Monaco|Virtus|Olimpia Milano|Armani|Bayern|ASVEL|Paris Basketball|Dubai Basketball"),
              ("acb", r"\bACB\b|\bacb\b|Liga Endesa|Copa del Rey|Supercopa|Unicaja|Joventut|Gran Canaria|Tenerife|Bilbao|Manresa|Lleida|Breog|Murcia|Granada|Andorra|Burgos|Zaragoza|Girona|Valencia Basket|Real Madrid|Barça|Barcelona|Estudiantes|Primera FEB"),
              ("fiba", r"\bFIBA\b|Mundial|World Cup|EuroBasket|Eurobasket|AmeriCup|Olímpic|Olympic|selección|Selección|national team|ventana|window|Qualifiers|clasificatorio"),
          ]
          SKIP = r"Black Friday|descuento|oferta|suscr[ií]bete|sorteo|giveaway|cup[oó]n|podcast"

          def clean(s):
              s = html.unescape(re.sub(r"<[^>]+>", "", s or "")).strip()
              return re.sub(r"\s+", " ", s)

          def parse_date(s):
              if not s: return None
              try:
                  d = email.utils.parsedate_to_datetime(s)
              except Exception:
                  try: d = datetime.datetime.fromisoformat(s.replace("Z", "+00:00"))
                  except Exception: return None
              if d.tzinfo is None: d = d.replace(tzinfo=datetime.timezone.utc)
              return d.astimezone(datetime.timezone.utc)

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (COURTSIDE headlines; +https://thecourtsideclub.netlify.app)"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.read()

          def items_of(xml):
              root = ET.fromstring(xml)
              for it in root.iter():
                  tag = it.tag.split("}")[-1]
                  if tag not in ("item", "entry"): continue
                  kid = {c.tag.split("}")[-1]: c for c in it}
                  title = clean(kid["title"].text if "title" in kid else "")
                  link = ""
                  if "link" in kid:
                      link = (kid["link"].text or kid["link"].get("href") or "").strip()
                  date = None
                  for k in ("pubDate", "published", "updated", "date"):
                      if k in kid: date = parse_date(kid[k].text); break
                  yield title, link, date

          now = datetime.datetime.now(datetime.timezone.utc)
          limit = now - datetime.timedelta(days=4)
          out, seen = [], set()
          for f in FEEDS:
              try:
                  data = fetch(f["url"])
                  n = 0
                  for title, link, date in items_of(data):
                      if not title or not link.startswith("http") or link in seen: continue
                      if re.search(SKIP, title, re.I): continue
                      if date and date < limit: continue
                      cat = f.get("c")
                      if not cat:
                          cat = next((c for c, rx in RULES if re.search(rx, title)), "international")
                      seen.add(link)
                      out.append({"t": title[:220], "u": link, "s": f["s"], "l": f["l"], "c": cat,
                                  "d": (date or now).isoformat(timespec="minutes")})
                      n += 1
                      if n >= 25: break
                  print(f"OK {f['url']}: {n}")
              except Exception as ex:
                  print(f"ERROR {f['url']}: {ex}")

          out.sort(key=lambda i: i["d"], reverse=True)
          if out:
              with open("noticias.json", "w", encoding="utf-8") as fh:
                  json.dump({"updated": now.isoformat(timespec="minutes"), "items": out[:120]}, fh, ensure_ascii=False, indent=1)
              print("Titulares guardados:", len(out))
          else:
              print("No se ha descargado ningún titular; se mantiene el archivo anterior.")
          PY

      - name: Guardar noticias.json
        if: steps.hora.outputs.go == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json || true
          git commit -m "Titulares $(TZ=Europe/Madrid date '+%d/%m %H:%M')" || echo "Sin cambios"
          git push
